name: Terraform PR Workflow

on:
  push:
    branches-ignore:
      - main

jobs:
  terraform-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # full history

      # 2️⃣ Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.5

      # 3️⃣ Configure AWS credentials
      - name: Configure AWS Credentials
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV

      # 4️⃣ Terraform init
      - name: Terraform Init
        run: terraform -chdir=terraform init

      # 5️⃣ Terraform plan
      - name: Terraform Plan
        run: terraform -chdir=terraform plan -no-color > plan.txt

      # 6️⃣ Install GitHub CLI
      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install gh -y

      # 7️⃣ Authenticate GitHub CLI
      - name: Authenticate GitHub CLI
        run: gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}"

      # 8️⃣ Create or update Pull Request
      - name: Create or update Pull Request
        run: |
          PR_EXISTS=$(gh pr list --head $GITHUB_REF_NAME --json number -q '.[].number')
          if [ -z "$PR_EXISTS" ]; then
            # Create a new PR
            gh pr create \
              --title "Terraform changes" \
              --body "$(cat plan.txt)" \
              --base main \
              --head $GITHUB_REF_NAME \
              --reviewer saisatwik21 \
              --label auto-pr
          else
            # Update existing PR body
            gh pr edit $PR_EXISTS --body "$(cat plan.txt)"
          fi
